name: Bug report
description: Report a problem with Solina Launcher.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap on ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Open Solina Launcher settings > About to view the version.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs (optional)
