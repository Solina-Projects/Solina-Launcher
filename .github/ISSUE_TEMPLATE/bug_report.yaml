name: Bug report
description: Report a reproducible problem in Solina Launcher
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please check for an existing report first. Development test builds are published as GitHub Actions artifacts:
        https://github.com/Solina-Projects/Solina-Launcher/actions
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Solina Launcher version
      description: Include the version/build number shown in About.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove personal information before sharing logs.
    validations:
      required: false
