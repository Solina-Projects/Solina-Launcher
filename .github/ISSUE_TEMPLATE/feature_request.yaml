name: Feature request
description: Suggest an improvement for Solina Launcher
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Solina Launcher is under active development; not every request can be implemented immediately.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case or difficulty.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the behavior or feature you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
