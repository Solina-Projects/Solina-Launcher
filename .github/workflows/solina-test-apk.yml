name: Solina Launcher test APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solina-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source including submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleLawnWithoutQuickstepGithubDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: solina-launcher-test-apk-${{ github.run_number }}
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
