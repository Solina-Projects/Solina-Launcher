name: Solina Launcher release candidate build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-candidate:
    name: Build unsigned standalone release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source including submodules
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build standalone APK without Quickstep
        run: ./gradlew --no-daemon assembleSolinaWithoutQuickstepGithubRelease
      - name: Upload release candidate for review
        uses: actions/upload-artifact@v7
        with:
          name: solina-launcher-standalone-unsigned-release-candidate
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
