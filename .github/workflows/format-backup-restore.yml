name: Temporary backup restore formatting

on:
  pull_request:
    paths:
      - 'lawnchair/src/app/lawnchair/backup/**'
      - '.github/workflows/format-backup-restore.yml'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply formatter and print patch
        run: |
          ./gradlew spotlessApply
          git diff -- lawnchair/src/app/lawnchair/backup/LawnchairBackup.kt lawnchair/src/app/lawnchair/backup/NovaBackupConverter.kt lawnchair/src/app/lawnchair/backup/ui/RestoreBackupScreen.kt
