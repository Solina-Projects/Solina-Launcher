name: Solina Launcher - Test and Release

on:
  push:
    branches:
      - 'Solina-Launcher-Test'
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches:
      - main
      - 'Solina-Launcher-Test'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: assembleLawnWithoutQuickstepGithubDebug
            artifact: Solina-Launcher-Standard-Test
          - variant: assembleLawnWithoutQuickstepGithubRelease
            artifact: Solina-Launcher-Standard-Release
          - variant: assembleLawnWithQuickstepGithubDebug
            artifact: Solina-Launcher-Quickstep-Test
          - variant: assembleLawnWithQuickstepGithubRelease
            artifact: Solina-Launcher-Quickstep-Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;28.0.13004108'
      - name: Install rust-anything
        shell: bash
        run: |
          curl -sL -o /tmp/rust-anything.tar.gz https://github.com/erkamyaman/rust-anything/releases/download/v2.1.0/rust-anything-v2.1.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/rust-anything.tar.gz -C /tmp
          sudo install -m 755 /tmp/rust-anything-v2.1.0-x86_64-unknown-linux-gnu/rust-anything /usr/local/bin/rust-anything
          rust-anything --version
      - name: Write signing information
        if: github.repository_owner == 'Solina-Projects'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
            echo "storeFile=$GITHUB_WORKSPACE/key.jks" >> keystore.properties
            printf '%s' "$KEYSTORE" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
          fi
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew "${{ matrix.variant }}" 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          errors=$(grep -E "^e: |error:|What went wrong|Execution failed|AAPT|FAILED" -A2 build.log | head -40 | cut -c1-300 | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${errors}"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 90

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck licensee

  final-status:
    needs:
      - build
      - check
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Verify all builds and checks
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        shell: bash
        run: |
          success_count=$(grep -o '"success"' <<< "$RESULTS" | wc -l)
          if [[ "$success_count" -ne 2 ]]; then
            echo "Expected both build and check jobs to succeed; got: $RESULTS"
            exit 1
          fi
          echo "All four Standard/Quickstep Test/Release APK variants and required checks completed successfully."
