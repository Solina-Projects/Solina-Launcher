name: Solina Launcher - Test and Release

on:
  push:
    branches:
      - 'main'
      - '*-dev'
      - 'Solina-Launcher-Test'
      - 'feature/**'
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: assembleLawnWithQuickstepGithubDebug
            artifact: Solina-Launcher-Test
          - variant: assembleLawnWithQuickstepGithubRelease
            artifact: Solina-Launcher-Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==
      - name: Write signing information
        if: github.repository_owner == 'Solina-Projects'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
            echo "storeFile=$GITHUB_WORKSPACE/key.jks" >> keystore.properties
            printf '%s' "$KEYSTORE" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
          fi
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew "${{ matrix.variant }}" 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          errors=$(grep -E "^e: |error:|What went wrong|Execution failed|AAPT|FAILED" -A2 build.log | head -40 | cut -c1-300 | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${errors}"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 90

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck licensee

  final-status:
    needs:
      - build
      - check
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Verify all builds and checks
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        shell: bash
        run: |
          if grep -q -E '"(failure|cancelled)"' <<< "$RESULTS"; then
            echo "A build or required check failed."
            exit 1
          fi
          echo "Both APK variants and required checks completed successfully."
