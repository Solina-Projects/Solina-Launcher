[package]
name = "search-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `search/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
jni = "0.21"
unicode-normalization = "0.1"
rayon = "1"
mimalloc = "0.1"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
# The tool-generated lib.rs carries batch helpers (e.g. batch_utf16 for
# string batches) that this crate's number batch never calls; allowing
# dead_code here keeps clippy green without hand-editing generated code.
dead_code = "allow"
